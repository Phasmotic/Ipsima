name: Talaria
options:
  bundleIdPrefix: dev.schonfeld.talaria
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.6"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    # Tier B builds are simulator/archive-only until P6 (hard-gated).
    CODE_SIGNING_ALLOWED: NO

packages:
  HermesKit:
    path: Packages/HermesKit

targets:
  Talaria:
    type: application
    platform: iOS
    sources:
      - App/Talaria
    dependencies:
      - package: HermesKit
      - target: TalariaWidgets   # extension embedded in the app bundle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schonfeld.talaria.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_STRICT_CONCURRENCY: complete

  TalariaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/TalariaWidgets
    dependencies:
      - package: HermesKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schonfeld.talaria.app.widgets
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete

  TalariaWatch:
    type: application
    platform: watchOS
    sources:
      - App/TalariaWatch
    dependencies:
      - package: HermesKit
      - target: TalariaWatchWidgets   # extension embedded in the watch app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schonfeld.talaria.watchkitapp
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        SWIFT_STRICT_CONCURRENCY: complete

  TalariaWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - App/TalariaWatchWidgets
    dependencies:
      - package: HermesKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schonfeld.talaria.watchkitapp.widgets
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete

  TalariaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/TalariaTests
    dependencies:
      - target: Talaria

  TalariaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/TalariaUITests
    dependencies:
      - target: Talaria

  TalariaWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - Tests/TalariaWatchUITests
    dependencies:
      - target: TalariaWatch

schemes:
  Talaria-iOS:
    build:
      targets:
        Talaria: all
    test:
      targets:
        - TalariaTests

  Talaria-UI:
    build:
      targets:
        Talaria: all
    test:
      targets:
        - TalariaUITests

  Talaria-Watch:
    build:
      targets:
        TalariaWatch: all

  Talaria-WatchUI:
    build:
      targets:
        TalariaWatch: all
    test:
      targets:
        - TalariaWatchUITests
