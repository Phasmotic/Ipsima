name: Talaria
options:
  bundleIdPrefix: dev.schonfeld.talaria
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.6"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    # Tier B builds are simulator/archive-only until P7 (hard-gated).
    CODE_SIGNING_ALLOWED: NO

packages:
  HermesKit:
    path: Packages/HermesKit

targets:
  Talaria:
    type: application
    platform: iOS
    sources:
      - App/Talaria
    dependencies:
      - package: HermesKit
      # Xcode 26 always runs metadata extraction for Swift app bundles; P4 uses App Intents.
      - sdk: AppIntents.framework
      - target: TalariaWidgets   # extension embedded in the app bundle
      - target: TalariaWatch     # watch app embedded in the iOS app bundle
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schonfeld.talaria.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TALARIA_LINK_TRANSPORT"
        OTHER_LDFLAGS: "$(inherited) -Wl,-u,_talaria_launch_link_anchor"
        LD_GENERATE_MAP_FILE: YES
        LD_MAP_FILE_PATH: "$(PROJECT_TEMP_DIR)/Talaria-LinkMap-$(CURRENT_ARCH).txt"

  TalariaWidgets:
    type: app-extension
    platform: iOS
    info:
      path: .gauntlet/generated/TalariaWidgets-Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - App/TalariaWidgets
    dependencies:
      - package: HermesKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.schonfeld.talaria.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete

  TalariaWatch:
    type: application
    platform: watchOS
    sources:
      - App/TalariaWatch
    dependencies:
      - package: HermesKit
      # Xcode 26 always runs metadata extraction for Swift app bundles; P4 uses App Intents.
      - sdk: AppIntents.framework
      - target: TalariaWatchWidgets   # extension embedded in the watch app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schonfeld.talaria.app.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.schonfeld.talaria.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        SWIFT_STRICT_CONCURRENCY: complete

  TalariaWatchWidgets:
    type: app-extension
    platform: watchOS
    info:
      path: .gauntlet/generated/TalariaWatchWidgets-Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - App/TalariaWatchWidgets
    dependencies:
      - package: HermesKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.schonfeld.talaria.app.watchkitapp.widgets
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete

  TalariaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/TalariaTests
    dependencies:
      - target: Talaria
      # Xcode 26 runs App Intents metadata extraction for Swift test bundles too.
      - sdk: AppIntents.framework

  TalariaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/TalariaUITests
    dependencies:
      - target: Talaria
      - sdk: AppIntents.framework

  TalariaLaunchABTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/TalariaLaunchABTests
    dependencies:
      - target: Talaria
      - sdk: AppIntents.framework

  TalariaWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - Tests/TalariaWatchUITests
    dependencies:
      - target: TalariaWatch
      - sdk: AppIntents.framework

schemes:
  Talaria-iOS:
    build:
      targets:
        Talaria: all
    test:
      targets:
        - TalariaTests

  Talaria-UI:
    build:
      targets:
        Talaria: all
    test:
      targets:
        - TalariaUITests

  Talaria-LinkAB:
    build:
      targets:
        Talaria: all
    test:
      targets:
        - TalariaLaunchABTests

  Talaria-Watch:
    build:
      targets:
        TalariaWatch: all

  Talaria-WatchUI:
    build:
      targets:
        TalariaWatch: all
    test:
      targets:
        - TalariaWatchUITests
