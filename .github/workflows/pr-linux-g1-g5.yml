on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-linux-g1-g5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux:
    name: Advisory G1–G5
    permissions:
      contents: read
